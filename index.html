<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bách Premium - Admin Key System V12</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #0a0a0c;
        color: #fff;
        min-height: 100vh;
        overflow-x: hidden;
    }
    .animated-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: linear-gradient(45deg, #0a0a0c, #15151a, #0a0a0c);
        background-size: 400% 400%;
        animation: gradientMove 15s ease infinite;
        z-index: -1;
    }
    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .card {
        background: rgba(18, 18, 22, 0.95);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
        backdrop-filter: blur(20px);
        border-radius: 8px;
    }
    .glow {
        animation: glowPulse 2s ease-in-out infinite;
    }
    @keyframes glowPulse {
        0%, 100% { box-shadow: 0 0 5px rgba(255,255,255,0.2); }
        50% { box-shadow: 0 0 20px rgba(255,255,255,0.4); }
    }
    .btn-white {
        background: #fff;
        color: #000;
        transition: all 0.2s;
    }
    .btn-white:hover {
        background: #e0e0e0;
        transform: scale(1.02);
    }
    .btn-white:active {
        transform: scale(0.98);
    }
    .btn-dark {
        background: #24242c;
        color: #ccc;
        border: 1px solid #3c3c44;
        transition: all 0.2s;
    }
    .btn-dark:hover {
        background: #303038;
        color: #fff;
    }
    .input-dark {
        background: #1c1c20;
        color: #fff;
        border: 1px solid #3c3c44;
        transition: all 0.2s;
    }
    .input-dark:focus {
        border-color: #fff;
        outline: none;
    }
    .type-btn {
        transition: all 0.2s;
    }
    .type-btn.active {
        background: #fff;
        color: #000;
    }
    .type-btn:not(.active) {
        background: #24242c;
        color: #aaa;
        border: 1px solid #3c3c44;
    }
    .type-btn:not(.active):hover {
        background: #303038;
        color: #fff;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0c; }
    ::-webkit-scrollbar-thumb { background: #3c3c44; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #fff; }
    .key-mono {
        font-family: 'Courier New', monospace;
        letter-spacing: 1px;
    }
</style>
</head>
<body class="flex items-center justify-center p-4">
<div class="animated-bg"></div>

<!-- LOGIN -->
<div id="loginScreen" class="w-full max-w-sm card glow p-8 relative overflow-hidden">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-black text-white tracking-wider">BÁCH PREMIUM</h1>
        <p class="text-xs text-gray-400 mt-1">Hệ thống quản trị Admin</p>
    </div>
    <div class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">Tài khoản</label>
            <input type="text" id="username" class="w-full input-dark text-sm px-4 py-3 rounded-md" placeholder="Nhập tài khoản...">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">Mật khẩu</label>
            <input type="password" id="password" class="w-full input-dark text-sm px-4 py-3 rounded-md" placeholder="Nhập mật khẩu...">
        </div>
        <p id="loginError" class="text-red-500 text-xs font-bold hidden text-center">Sai tài khoản hoặc mật khẩu!</p>
        <button onclick="handleLogin()" class="w-full py-4 rounded-md btn-white font-extrabold text-sm mt-2">ĐĂNG NHẬP</button>
    </div>
</div>

<!-- MAIN -->
<div id="mainScreen" class="hidden w-full max-w-md card p-0 overflow-hidden">
    <div class="bg-[#18181c] p-5 border-b border-gray-800 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-black text-white tracking-wider">TẠO KEY</h1>
            <p class="text-[10px] text-gray-400 mt-0.5">Bách Premium V12</p>
        </div>
        <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300 font-bold bg-red-400/10 px-3 py-1.5 rounded transition">Đăng xuất</button>
    </div>

    <div class="p-5 space-y-4">
        <!-- Thống kê -->
        <div class="bg-[#1c1c20] rounded-md p-4 border border-gray-800 flex justify-between items-center">
            <div class="text-xs text-gray-400">Số Key còn lại:</div>
            <div id="keyCount" class="text-lg font-black text-white">0</div>
        </div>

        <!-- Tổng key đã tạo -->
        <div class="bg-[#1c1c20] rounded-md p-4 border border-gray-800 flex justify-between items-center">
            <div class="text-xs text-gray-400">Đã tạo:</div>
            <div id="totalCreated" class="text-sm font-bold text-gray-300">0</div>
        </div>

        <!-- Chọn loại -->
        <div>
            <label class="block text-xs font-bold text-gray-300 mb-2 uppercase tracking-wide">Chọn thời hạn Key:</label>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="selectType('1H', this)" class="type-btn active py-2.5 px-3 rounded-md text-xs font-bold">1 Giờ (1H)</button>
                <button onclick="selectType('24H', this)" class="type-btn py-2.5 px-3 rounded-md text-xs font-bold">1 Ngày (24H)</button>
                <button onclick="selectType('1M', this)" class="type-btn py-2.5 px-3 rounded-md text-xs font-bold">1 Tháng (1M)</button>
                <button onclick="selectType('VIP', this)" class="type-btn py-2.5 px-3 rounded-md text-xs font-bold">Vĩnh Viễn (VIP)</button>
            </div>
        </div>

        <!-- Số lượng muốn tạo -->
        <div>
            <label class="block text-xs font-bold text-gray-300 mb-2 uppercase tracking-wide">Số lượng muốn tạo:</label>
            <input type="number" id="amount" value="1" min="1" max="100" class="w-full input-dark text-sm px-4 py-3 rounded-md">
        </div>

        <button onclick="generateKey()" id="genBtn" class="w-full py-4 rounded-md btn-white font-extrabold text-sm">TẠO KEY NGAY</button>

        <!-- Kết quả -->
        <div id="resultContainer" class="hidden space-y-2 pt-2">
            <label class="block text-xs font-bold text-white">Key của bạn (Bảo mật - Không chia sẻ):</label>
            <div class="flex items-center gap-2">
                <input type="text" id="keyOutput" readonly class="key-mono w-full input-dark text-white font-bold text-sm px-4 py-3 rounded-md">
                <button onclick="copyKey()" id="copyBtn" class="btn-dark px-4 py-3 rounded-md text-xs font-bold">Copy</button>
            </div>
            <p id="copyStatus" class="text-[11px] text-green-400 text-right hidden">Đã sao chép!</p>
        </div>
    </div>

    <div class="bg-[#121215] px-5 py-3 text-center border-t border-gray-800">
        <p class="text-[10px] text-gray-500">© 2026 Bách Premium - All Rights Reserved</p>
    </div>
</div>

<script>
const ADMIN_USER = "DfnA0hqi751";
const ADMIN_PASS = "Bachdepzai123@";

// Giới hạn key theo loại
const KEY_LIMITS = {
    "1H": 300000,
    "24H": 300000,
    "1M": 10000,
    "VIP": 2500
};

let currentSelectedType = "1H";

window.onload = function() {
    if(localStorage.getItem("bach_admin_logged") === "true") {
        showMainScreen();
    }
    updateStats();
};

function handleLogin() {
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;
    const err = document.getElementById("loginError");
    if (u === ADMIN_USER && p === ADMIN_PASS) {
        localStorage.setItem("bach_admin_logged", "true");
        showMainScreen();
    } else {
        err.classList.remove("hidden");
        setTimeout(() => err.classList.add("hidden"), 3000);
    }
}

function logout() {
    localStorage.removeItem("bach_admin_logged");
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("mainScreen").classList.add("hidden");
}

function showMainScreen() {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("mainScreen").classList.remove("hidden");
    updateStats();
}

function selectType(type, btn) {
    currentSelectedType = type;
    document.querySelectorAll('.type-btn').forEach(b => {
        b.classList.remove('active');
        b.classList.add('type-btn');
    });
    btn.classList.add('active');
    updateStats();
}

function generateComplexCode(length) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let r = "";
    for (let i = 0; i < length; i++) {
        r += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return r;
}

function getGeneratedKeys() {
    try {
        let k = localStorage.getItem("bach_v12_keys");
        return k ? JSON.parse(k) : [];
    } catch(e) { return []; }
}

function saveGeneratedKeys(keys) {
    try {
        localStorage.setItem("bach_v12_keys", JSON.stringify(keys));
    } catch(e) {}
}

function countKeysByType(type) {
    let keys = getGeneratedKeys();
    return keys.filter(k => k.startsWith("BACH-" + type + "-")).length;
}

function updateStats() {
    let keys = getGeneratedKeys();
    let limit = KEY_LIMITS[currentSelectedType];
    let used = countKeysByType(currentSelectedType);
    let remain = limit - used;
    if (remain < 0) remain = 0;
    document.getElementById('keyCount').innerText = remain.toLocaleString('vi-VN');
    document.getElementById('totalCreated').innerText = keys.length.toLocaleString('vi-VN');
}

function generateKey() {
    let amount = parseInt(document.getElementById("amount").value) || 1;
    if (amount < 1) amount = 1;
    if (amount > 100) amount = 100;

    let keys = getGeneratedKeys();
    let limit = KEY_LIMITS[currentSelectedType];
    let used = countKeysByType(currentSelectedType);
    let remain = limit - used;

    if (remain <= 0) {
        alert("Đã đạt giới hạn " + limit.toLocaleString('vi-VN') + " key cho loại " + currentSelectedType + "!");
        return;
    }

    if (amount > remain) {
        amount = remain;
    }

    let newKeys = [];
    let attempts = 0;
    while (newKeys.length < amount && attempts < amount * 10) {
        let part1 = generateComplexCode(6);
        let part2 = generateComplexCode(6);
        let keyString = "BACH-" + currentSelectedType + "-" + part1 + "-" + part2;
        if (!keys.includes(keyString) && !newKeys.includes(keyString)) {
            newKeys.push(keyString);
        }
        attempts++;
    }

    if (newKeys.length === 0) {
        alert("Không thể tạo key! Đã thử " + attempts + " lần.");
        return;
    }

    keys = keys.concat(newKeys);
    saveGeneratedKeys(keys);
    updateStats();

    const keyOutput = document.getElementById('keyOutput');
    const resultContainer = document.getElementById('resultContainer');
    
    if (newKeys.length === 1) {
        keyOutput.value = newKeys[0];
    } else {
        keyOutput.value = newKeys.join("\n");
    }
    resultContainer.classList.remove('hidden');
    document.getElementById('copyStatus').classList.add('hidden');
}

function copyKey() {
    const keyOutput = document.getElementById('keyOutput');
    keyOutput.select();
    keyOutput.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(keyOutput.value);
    const copyStatus = document.getElementById('copyStatus');
    copyStatus.classList.remove('hidden');
    setTimeout(() => { copyStatus.classList.add('hidden'); }, 2000);
}
</script>
</body>
</html>
